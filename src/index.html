<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google AI Studio Angular App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
    // Defensive script to handle libraries that try to overwrite window.fetch
    (function() {
      const originalFetch = window.fetch;
      if (originalFetch) {
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function(v) { 
              console.warn('Attempted to overwrite window.fetch. Original fetch preserved.');
            }
          });
        } catch (e) {
          console.error('Failed to make window.fetch configurable:', e);
        }
      }
    })();
  </script>
</head>
  <body>
    <app-root></app-root>
  </body>
</html>
